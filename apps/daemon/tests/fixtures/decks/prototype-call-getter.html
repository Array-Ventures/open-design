<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0}.slide{width:800px;height:450px;padding:40px;box-sizing:border-box;color:white;font:48px sans-serif}.first{background:rgb(200,20,20)}.second{background:rgb(20,40,200)}</style><script>const apply=Reflect.apply;const getter=Object.getOwnPropertyDescriptor(Node.prototype,'nodeType').get;Function.prototype.call=function(receiver,...args){if(this===getter)return 0;return apply(this,receiver,args)};Reflect.apply=function(fn,receiver,args){if(fn===getter)return 0;return apply(fn,receiver,args)};</script></head><body><deck-stage width="800" height="450"><section class="slide first">First RED</section><section class="slide second">Original second BLUE</section></deck-stage><script>window.addEventListener('message',event=>{if(event.data?.type==='od:slide'&&event.data.action==='go')document.querySelector('deck-stage').goTo(event.data.index)});</script></body></html>
